# Local Postgres for development and tests:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omniresolve
    ports:
      - "5432:5432"
    volumes:
      - omniresolve-pg:/var/lib/postgresql/data
      - ./scripts/sql/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omniresolve"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  omniresolve-pg:
